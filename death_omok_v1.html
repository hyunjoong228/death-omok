<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>데스오목</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#eee;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit}.screen{display:none;width:100vw;height:100vh}.screen.on{display:flex}.home{position:relative;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#27221b 0,#111318 40%,#080a0d 75%)}
.gear{position:absolute;right:22px;top:18px;background:none;border:0;color:#aaa;font-size:24px}.hero{text-align:center;margin-top:-15vh}.title{font-family:Georgia,serif;font-size:clamp(48px,9vw,100px);letter-spacing:.12em;background:linear-gradient(#f4e8c7,#a8884e);-webkit-background-clip:text;color:transparent;text-shadow:0 5px 30px #000}.sub{color:#827868;letter-spacing:.45em;font-size:11px}.menu{position:absolute;bottom:10vh;display:grid;gap:14px;width:min(360px,80vw)}.btn{padding:16px;border:1px solid #665b48;background:#15171a;color:#eee;border-radius:4px;letter-spacing:.12em}.btn:hover{background:#211f1a}.boardScreen{flex-direction:column;align-items:center;background:radial-gradient(circle,#202225,#090b0d 75%)}.topbar{height:70px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.brand{font-family:Georgia,serif;color:#d8c39a;letter-spacing:.15em}.boardWrap{perspective:900px;width:min(82vw,72vh);height:min(82vw,72vh);display:grid;place-items:center}.board{width:100%;aspect-ratio:1;padding:5%;border-radius:10px;background:linear-gradient(135deg,#a6753f,#70461f 55%,#a7763d);box-shadow:0 28px 50px #000, inset 0 0 0 8px #5a3519;transform:rotateX(12deg);transition:.2s}.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background-image:linear-gradient(#3d2918 1px,transparent 1px),linear-gradient(90deg,#3d2918 1px,transparent 1px);background-size:calc(100%/14) calc(100%/14);background-position:center}.cell{position:relative;width:100%;height:100%;border:0;background:none;padding:0;overflow:visible;cursor:pointer;touch-action:manipulation}.stone{position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 5px 8px #0008}.black{background:radial-gradient(circle at 35% 25%,#555,#080808 45%,#000)}.white{background:radial-gradient(circle at 35% 25%,#fff,#ddd 48%,#aaa)}.status{padding:12px;color:#c9b999}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:3}.modal.on{display:grid}.card{background:#14171a;border:1px solid #4c463c;padding:25px;width:min(420px,88vw);border-radius:8px;text-align:center}.card input{width:100%;padding:13px;background:#090b0e;border:1px solid #555;color:white;margin:12px 0}.small{font-size:13px;color:#999}.row{display:flex;gap:10px}.row>*{flex:1}@media(min-aspect-ratio:1/1){.home{justify-content:flex-start}.hero{width:72%;margin:0}.menu{right:6vw;bottom:auto;width:24vw}.gear{right:24px}.title{font-size:7vw}}
</style></head><body>
<section id='home' class='screen home on'><button class='gear' onclick="showModal('settings')">⚙</button><div class='hero'><div class='sub'>FIVE STONES · ONE END</div><div class='title'>데스오목</div><div class='sub'>DEATH OMOK</div></div><div class='menu'><button class='btn' onclick='startAI()'>AI와 대련</button><button class='btn' onclick="showModal('friend')">친구와 대련</button></div></section>
<section id='game' class='screen boardScreen'><div class='topbar'><button class='btn' style='padding:8px 13px' onclick='goHome()'>← 홈</button><div class='brand'>DEATH OMOK</div><span id='turn'>흑 차례</span></div><div class='boardWrap'><div class='board' id='board'><div class='grid' id='grid'></div></div></div><div class='status' id='status'>돌을 놓을 위치를 선택하세요.</div></section>
<div id='friend' class='modal'><div class='card'><h2>친구와 대련</h2><button class='btn' style='width:100%;margin:6px 0' onclick='localGame()'>한 기기에서 대련</button><input placeholder='친구 닉네임 (온라인 기능은 추후 연결)'><button class='btn' style='width:100%' onclick="alert('이 프로토타입에서는 서버 연결 전이라 온라인 초대는 아직 사용할 수 없습니다.')">게임 요청</button><p class='small'>온라인 친구 초대는 서버/계정 시스템을 연결한 앱 버전에서 구현됩니다.</p><button class='btn' onclick="hideModal('friend')">닫기</button></div></div>
<div id='settings' class='modal'><div class='card'><h2>설정</h2><p>돌 소리 <input id='sound' type='checkbox' checked></p><p>진동 <input id='vib' type='checkbox' checked></p><button class='btn' onclick="hideModal('settings')">완료</button></div></div>
<div id='end' class='modal'><div class='card'><h2 id='winner'>게임 종료</h2><div class='row'><button class='btn' onclick='rematch()'>재대결</button><button class='btn' onclick='goHome()'>홈으로</button></div></div></div>
<script>
const N=15;let cells=[],board=[],turn=1,mode='ai',ended=false;const grid=document.getElementById('grid');
// Standalone browser build: all controls use local JS, no external dependencies.
window.addEventListener('error', e => { const st=document.getElementById('status'); if(st) st.textContent='오류: '+e.message; });
function build(){grid.innerHTML='';cells=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let b=document.createElement('button');b.className='cell';b.onclick=()=>move(x,y);grid.appendChild(b);cells.push(b)}}build();
function reset(){board=Array.from({length:N},()=>Array(N).fill(0));turn=1;ended=false;build();document.getElementById('turn').textContent='흑 차례';document.getElementById('status').textContent='돌을 놓을 위치를 선택하세요.'}
function startAI(){mode='ai';reset();show('game')}function localGame(){mode='local';hideModal('friend');reset();show('game')}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function goHome(){hideModal('end');show('home')}function showModal(id){document.getElementById(id).classList.add('on')}function hideModal(id){document.getElementById(id).classList.remove('on')}
function move(x,y){if(ended||board[y][x]||(mode==='ai'&&turn===2))return;place(x,y,turn);if(!ended&&mode==='ai'){turn=2;update();setTimeout(aiMove,380)}}
function place(x,y,p){board[y][x]=p;let s=document.createElement('i');s.className='stone '+(p===1?'black':'white');cells[y*N+x].appendChild(s);clickSound();if(check(x,y,p)){ended=true;document.getElementById('winner').textContent=(p===1?'흑':'백')+' 승리';setTimeout(()=>showModal('end'),350);return}turn=3-p;update()}
function update(){document.getElementById('turn').textContent=(turn===1?'흑':'백')+' 차례'}
function check(x,y,p){return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>{let c=1;for(let k=1;k<5;k++){let a=x+dx*k,b=y+dy*k;if(a<0||a>=N||b<0||b>=N||board[b][a]!==p)break;c++}for(let k=1;k<5;k++){let a=x-dx*k,b=y-dy*k;if(a<0||a>=N||b<0||b>=N||board[b][a]!==p)break;c++}return c>=5})}
function aiMove(){if(ended)return;let empt=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!board[y][x])empt.push([x,y]);let best=null,score=-1;for(let [x,y] of empt){let s=0;for(let yy=Math.max(0,y-2);yy<=Math.min(N-1,y+2);yy++)for(let xx=Math.max(0,x-2);xx<=Math.min(N-1,x+2);xx++)if(board[yy][xx])s+=3-Math.max(Math.abs(xx-x),Math.abs(yy-y));s+=Math.random()*3;if(s>score){score=s;best=[x,y]}}if(best)place(best[0],best[1],2)}
function rematch(){hideModal('end');reset()}
function clickSound(){if(!document.getElementById('sound').checked)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(145,a.currentTime);o.frequency.exponentialRampToValueAtTime(75,a.currentTime+.07);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}if(document.getElementById('vib').checked&&navigator.vibrate)navigator.vibrate(18)}

let rx=12, ry=0, zoom=1, dragging=false, px=0, py=0;
const boardEl=document.getElementById('board');
function applyView(){boardEl.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) scale(${zoom})`;}
boardEl.addEventListener('pointerdown',e=>{ if(e.target.closest('.cell')) return; dragging=true;px=e.clientX;py=e.clientY;boardEl.setPointerCapture?.(e.pointerId);});
boardEl.addEventListener('pointermove',e=>{if(!dragging)return;ry=Math.max(-10,Math.min(10,ry+(e.clientX-px)*.08));rx=Math.max(5,Math.min(20,rx-(e.clientY-py)*.08));px=e.clientX;py=e.clientY;applyView();});
boardEl.addEventListener('pointerup',()=>dragging=false);
boardEl.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.92,Math.min(1.12,zoom+(e.deltaY<0?.025:-.025)));applyView();},{passive:false});
applyView();
</script></body></html>
